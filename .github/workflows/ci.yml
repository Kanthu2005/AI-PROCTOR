name: ProctorAI CI - Test & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: proctorai_user
          POSTGRES_PASSWORD: proctorai_secure_pass
          POSTGRES_DB: proctorai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app -x backend/app/seed_*.py -ll -ii || true

      - name: Validate Alembic Migrations & Seed Test DB
        env:
          DATABASE_URL: postgresql://proctorai_user:proctorai_secure_pass@localhost:5432/proctorai_test_db
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed_demo_accounts

      - name: Run Complete Pytest Suite
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-32chars-minimum-signing-key!
          DATABASE_URL: sqlite:///./test_ci.db
          POSTGRES_DATABASE_URL: postgresql://proctorai_user:proctorai_secure_pass@localhost:5432/proctorai_test_db
          INTERNAL_RUNNER_SECRET: test-runner-secret-key-32chars-min!
        working-directory: backend
        run: |
          pytest --maxfail=5 --disable-warnings -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
